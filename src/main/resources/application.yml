spring:
  application:
    name: omni3d-api

  # --- DataSource ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thridify}
    username: ${DB_USER:3dify}
    password: ${DB_PASSWORD:3dify}
    driver-class-name: org.postgresql.Driver

  # --- Flyway (handled by FlywayConfig.kt) ---
  flyway:
    enabled: false

  # --- jOOQ ---
  jooq:
    sql-dialect: POSTGRES

  # --- RabbitMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: omni3d
    password: omni3d

  # --- Redis ---
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 42MB

  mvc:
    log-request-details: false

# --- Spring Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        omni3d.jobs.duration: true
      slo:
        http.server.requests: 50ms, 200ms, 500ms, 1s, 5s

# --- Custom App Config ---
omni3d:
  jwt:
    secret: "CHANGE_ME_IN_PRODUCTION_minimum_32_chars_long_secret_key_here!"
    expiration-ms: 86400000  # 24 hours

  r2:
    endpoint: "${R2_ENDPOINT:}"
    access-key: "${R2_ACCESS_KEY:}"
    secret-key: "${R2_SECRET_KEY:}"
    bucket: "${R2_BUCKET:}"
    public-url: "${R2_PUBLIC_URL:}"
    token: ""

  rabbitmq:
    exchange: omni3d.exchange
    queue: 3d_task_queue
    routing-key: generate.3d

  runpod:
    enabled: ${RUNPOD_ENABLED:false}
    api-url: "${RUNPOD_API_URL:}"
    api-key: "${RUNPOD_API_KEY:}"
    webhook-url: "${RUNPOD_WEBHOOK_URL:}"

# --- Stripe ---
stripe:
  secret-key: "${STRIPE_SECRET_KEY:sk_test_placeholder_replace_me}"
  webhook-secret: "${STRIPE_WEBHOOK_SECRET:whsec_placeholder_replace_me}"

server:
  port: 8080

# --- Logging ---
logging:
  level:
    root: INFO
    com.thridify: ${APP_LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.jooq: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId} jobId=%X{jobId} userId=%X{userId} apiKeyId=%X{apiKeyId}] - %msg%n"

# Shopify-facing UI and product merchandising belong to a separate app project.
shopify:
  enabled: ${SHOPIFY_ENABLED:false}
  client-id: ${SHOPIFY_CLIENT_ID:}
  client-secret: ${SHOPIFY_CLIENT_SECRET:}
  app-id: ${SHOPIFY_APP_ID:}
  app-handle: ${SHOPIFY_APP_HANDLE:}
  partner-org-id: ${SHOPIFY_PARTNER_ORG_ID:}
  partner-access-token: ${SHOPIFY_PARTNER_ACCESS_TOKEN:}
  api-version: "2026-07"
  jobs-enabled: ${SHOPIFY_JOBS_ENABLED:true}
  reconciliation-delay-ms: 60000
  privacy-delay-ms: 60000
  frontend-origins: ${SHOPIFY_FRONTEND_ORIGINS:}

# Provider selection affects only new jobs; persisted tasks retain their original provider.
generation:
  provider: ${GENERATION_PROVIDER:meshy}
  polling-enabled: ${GENERATION_POLLING_ENABLED:false}
  polling-delay-ms: 15000
  asset-hosts:
    meshy:
      - assets.meshy.ai
  meshy:
    enabled: ${MESHY_ENABLED:false}
    api-key: ${MESHY_API_KEY:}
    ai-model: ${MESHY_AI_MODEL:meshy-7.1}
    request-interval-ms: 500
