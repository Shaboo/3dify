  postgres:
    image: postgres:16-alpine
    container_name: omni3d-postgres
    environment:
      POSTGRES_DB: omni3d
      POSTGRES_USER: omni3d
      POSTGRES_PASSWORD: omni3d
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni3d"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omni3d-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omni3d-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - omni3d-network

  redis:
    image: redis:7-alpine
    container_name: omni3d-redis
    ports:
      - "6379:6379"
    networks:
      - omni3d-network

volumes:
  pgdata:

networks:
  omni3d-network:
    driver: bridge
